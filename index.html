<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Island — Watch Party</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ocean:        #0891B2;
      --ocean-deep:   #0E7490;
      --ocean-light:  #E0F2FE;
      --sand:         #FAF4E8;
      --sand-mid:     #F0E6D0;
      --coral:        #FB7185;
      --coral-hover:  #F43F5E;
      --white:        #FFFFFF;
      --ink:          #0F172A;
      --slate:        #475569;
      --muted:        #94A3B8;
      --border:       #E2E8F0;
      --radius:       12px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--sand);
      overflow: hidden;
    }

    /* =========================================
       LAYOUT
    ========================================= */
    .layout {
      display: flex;
      height: 100vh;
    }

    /* =========================================
       LEFT PANEL — BEACH SCENE
    ========================================= */
    .panel-left {
      flex: 0 0 60%;
      position: relative;
      overflow: hidden;
    }

    /* Layered sky → ocean gradient */
    .beach-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        #C9EEFF 0%,
        #8DD4F0 18%,
        #44B8E0 36%,
        #1A9FC8 50%,
        #0D8DB8 58%,
        #0D8DB8 62%,
        #3EC6A8 66%,   /* shallow reef glow */
        #BCA46A 70%,   /* wet sand edge */
        #CEBB80 76%,
        #D9CA92 84%,
        #E8DAA8 100%
      );
    }

    /* Sun */
    .sun {
      position: absolute;
      top: 9%;
      right: 18%;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%,
        #FFFCE8 0%, #FFE55A 45%, #FFC125 100%);
      box-shadow:
        0 0 0 12px rgba(255,210,60,0.12),
        0 0 0 28px rgba(255,190,40,0.08),
        0 0 80px 30px rgba(255,210,60,0.22);
    }

    /* Clouds */
    .clouds {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 30%;
    }

    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.82);
      border-radius: 50px;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.82);
      border-radius: 50%;
    }
    .c1 { width: 130px; height: 28px; top: 14%; left: 12%; }
    .c1::before { width: 54px; height: 54px; top: -30px; left: 16px; }
    .c1::after  { width: 38px; height: 38px; top: -20px; left: 54px; }

    .c2 { width: 95px; height: 22px; top: 7%; left: 44%; opacity: 0.65; }
    .c2::before { width: 42px; height: 42px; top: -24px; left: 12px; }
    .c2::after  { width: 30px; height: 30px; top: -14px; left: 46px; }

    .c3 { width: 70px; height: 18px; top: 20%; left: 28%; opacity: 0.5; }
    .c3::before { width: 32px; height: 32px; top: -18px; left: 8px; }
    .c3::after  { width: 22px; height: 22px; top: -10px; left: 34px; }

    /* Ocean shimmer lines */
    .shimmer-group {
      position: absolute;
      top: 55%;
      left: 0; right: 0;
      height: 14%;
      overflow: hidden;
    }
    .shimmer {
      position: absolute;
      height: 2px;
      border-radius: 2px;
      background: rgba(255,255,255,0.35);
      animation: shim linear infinite;
    }
    .shimmer:nth-child(1) { width: 42%; top: 18%; left: 5%;  animation-duration: 6s;  }
    .shimmer:nth-child(2) { width: 28%; top: 42%; left: 18%; animation-duration: 9s;  animation-delay: -3s; }
    .shimmer:nth-child(3) { width: 55%; top: 62%; left: 0%;  animation-duration: 7s;  animation-delay: -1s; }
    .shimmer:nth-child(4) { width: 35%; top: 82%; left: 10%; animation-duration: 11s; animation-delay: -5s; }
    @keyframes shim {
      0%   { opacity: 0.1; transform: scaleX(0.7) translateX(0);    }
      50%  { opacity: 0.5; transform: scaleX(1)   translateX(6%);   }
      100% { opacity: 0.1; transform: scaleX(0.7) translateX(0);    }
    }

    /* Wave foam edge */
    .wave-edge {
      position: absolute;
      top: 68%;
      left: -10%; right: -10%;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.28);
      filter: blur(6px);
    }

    /* Sand strip */
    .sand-strip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 32%;
      background: linear-gradient(to bottom,
        #BCA46A 0%, #CDB878 15%, #D9C98C 45%, #E8DAA8 100%);
      border-radius: 60% 60% 0 0 / 12% 12% 0 0;
    }

    /* Footprints on sand */
    .footprints {
      position: absolute;
      bottom: 4%;
      left: 30%;
      display: flex;
      gap: 18px;
      transform: rotate(-8deg);
    }
    .fp {
      width: 9px; height: 14px;
      background: rgba(180,155,90,0.55);
      border-radius: 50% 50% 40% 40%;
    }
    .fp:nth-child(even) { margin-top: 16px; margin-left: -6px; }

    /* Palm trees via inline SVG */
    .palms {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      pointer-events: none;
    }

    /* Beach overlay gradient + text */
    .beach-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(5,40,65,0.08) 0%,
        transparent 35%,
        rgba(5,40,65,0.18) 65%,
        rgba(5,40,65,0.65) 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 36px 44px 48px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-shadow: 0 1px 8px rgba(0,0,0,0.25);
    }
    .brand-pip {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #FFD14A;
      box-shadow: 0 0 8px 2px rgba(255,210,60,0.5);
    }

    .hero-copy {
      max-width: 420px;
    }
    .hero-copy h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 46px;
      font-weight: 400;
      color: white;
      line-height: 1.18;
      margin-bottom: 14px;
      text-shadow: 0 2px 24px rgba(0,0,0,0.35);
    }
    .hero-copy p {
      font-size: 15px;
      font-weight: 300;
      color: rgba(255,255,255,0.88);
      letter-spacing: 0.2px;
      line-height: 1.6;
      text-shadow: 0 1px 10px rgba(0,0,0,0.3);
    }

    /* =========================================
       RIGHT PANEL — AUTH
    ========================================= */
    .panel-right {
      flex: 0 0 40%;
      background: var(--sand);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 36px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle decorative blob */
    .panel-right::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(8,145,178,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Progress bar */
    .progress-rail {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--sand-mid);
    }
    .progress-fill {
      height: 100%;
      border-radius: 0 2px 2px 0;
      background: linear-gradient(to right, #0891B2, #22D3EE);
      transition: width 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Auth card */
    .auth-card {
      background: var(--white);
      border-radius: 20px;
      padding: 38px 34px;
      width: 100%;
      max-width: 372px;
      border: 1px solid rgba(226,232,240,0.9);
      box-shadow:
        0 2px 8px rgba(0,0,0,0.04),
        0 8px 32px rgba(0,0,0,0.06);
      position: relative;
      z-index: 1;
    }

    /* Step animation */
    .step-body {
      animation: slide-in 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(18px); }
      to   { opacity: 1; transform: translateX(0);    }
    }

    /* Typography inside card */
    .step-badge {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--ocean);
      margin-bottom: 8px;
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 5px;
      line-height: 1.3;
    }
    .card-sub {
      font-size: 13.5px;
      color: var(--slate);
      line-height: 1.55;
      margin-bottom: 26px;
    }

    /* Social buttons */
    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s, background 0.18s;
      margin-bottom: 9px;
      font-family: 'Inter', sans-serif;
    }
    .btn-social:hover {
      border-color: #CBD5E1;
      background: #F8FAFC;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.07);
    }
    .btn-social:active { transform: translateY(0); }
    .btn-social:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 16px;
    }
    .div-line { flex: 1; height: 1px; background: var(--border); }
    .div-text { font-size: 11.5px; color: var(--muted); }

    /* Form fields */
    .field { margin-bottom: 13px; }
    .field-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--slate);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }
    .badge-opt {
      font-size: 9.5px;
      font-weight: 500;
      color: var(--muted);
      background: var(--sand);
      padding: 2px 7px;
      border-radius: 20px;
    }
    .field-input {
      width: 100%;
      padding: 11.5px 13px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 13.5px;
      color: var(--ink);
      background: var(--white);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      font-family: 'Inter', sans-serif;
    }
    .field-input::placeholder { color: var(--muted); }
    .field-input:focus {
      border-color: var(--ocean);
      box-shadow: 0 0 0 3px rgba(8,145,178,0.1);
    }
    .field-input.err {
      border-color: var(--coral) !important;
      box-shadow: 0 0 0 3px rgba(251,113,133,0.12) !important;
    }
    .field-err {
      font-size: 11.5px;
      color: var(--coral-hover);
      margin-top: 5px;
      display: none;
    }

    /* Primary CTA */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13.5px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0891B2 0%, #0A7898 100%);
      color: white;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: transform 0.18s, box-shadow 0.18s;
      margin-top: 4px;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(8,145,178,0.38);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Back button */
    .btn-back {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      font-size: 12.5px;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      margin-bottom: 18px;
      font-family: 'Inter', sans-serif;
      transition: color 0.18s;
    }
    .btn-back:hover { color: var(--slate); }

    /* Spinner */
    .spin {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: rotate 0.7s linear infinite;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }

    /* Terms */
    .terms {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      margin-top: 18px;
      line-height: 1.65;
      max-width: 320px;
    }
    .terms a { color: var(--ocean); text-decoration: none; }
    .terms a:hover { text-decoration: underline; }

    /* Success */
    .success-wrap {
      text-align: center;
      padding: 16px 0 8px;
    }
    .success-icon {
      width: 62px; height: 62px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0891B2, #22D3EE);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 6px 20px rgba(8,145,178,0.3);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: #0F172A;
      color: white;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.18);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.28s, transform 0.28s;
      pointer-events: none;
      z-index: 9999;
      max-width: 300px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-pip {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #22C55E;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* =========================================
       MOBILE
    ========================================= */
    @media (max-width: 768px) {
      .panel-left  { display: none; }
      .panel-right {
        flex: 0 0 100%;
        padding: 48px 20px 32px;
        background: linear-gradient(160deg, #EAF8FD 0%, var(--sand) 40%);
      }
      .auth-card { padding: 30px 24px; }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- ==================
       LEFT: BEACH PANEL
  ================== -->
  <div class="panel-left">
    <div class="beach-bg"></div>

    <!-- Sun -->
    <div class="sun"></div>

    <!-- Clouds -->
    <div class="clouds">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
    </div>

    <!-- Ocean shimmer -->
    <div class="shimmer-group">
      <div class="shimmer"></div>
      <div class="shimmer"></div>
      <div class="shimmer"></div>
      <div class="shimmer"></div>
    </div>

    <!-- Wave foam -->
    <div class="wave-edge"></div>

    <!-- Sand -->
    <div class="sand-strip"></div>

    <!-- Footprints -->
    <div class="footprints">
      <div class="fp"></div>
      <div class="fp"></div>
      <div class="fp"></div>
      <div class="fp"></div>
      <div class="fp"></div>
      <div class="fp"></div>
    </div>

    <!-- Palm trees (SVG) -->
    <div class="palms">
      <svg width="100%" height="100%" viewBox="0 0 900 700" preserveAspectRatio="xMidYMax meet" style="position:absolute;bottom:0;left:0;">
        <!-- LEFT PALM -->
        <g transform="translate(60, 700)">
          <!-- Trunk -->
          <path d="M0 0 Q-8 -80 -14 -160 Q-18 -230 -20 -300" stroke="#7A5420" stroke-width="13" stroke-linecap="round" fill="none"/>
          <!-- Fronds -->
          <path d="M-20 -300 Q-90 -340 -130 -360" stroke="#2A7A2A" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M-20 -300 Q-55 -355 -40 -390" stroke="#337A33" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M-20 -300 Q-20 -360 5 -385"   stroke="#2A7A2A" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M-20 -300 Q20 -345 55 -340"   stroke="#337A33" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M-20 -300 Q30 -305 75 -300"   stroke="#2A7A2A" stroke-width="5" stroke-linecap="round" fill="none"/>
          <!-- Frond fills -->
          <path d="M-20 -300 Q-90 -340 -130 -360 Q-75 -330 -20 -300" fill="#358A35" opacity="0.85"/>
          <path d="M-20 -300 Q-55 -355 -40 -390 Q-30 -350 -20 -300" fill="#2E7A2E" opacity="0.85"/>
          <path d="M-20 -300 Q-20 -360 5 -385 Q-5 -345 -20 -300"   fill="#358A35" opacity="0.85"/>
          <path d="M-20 -300 Q20 -345 55 -340 Q22 -322 -20 -300"   fill="#2E7A2E" opacity="0.85"/>
          <path d="M-20 -300 Q30 -305 75 -300 Q22 -302 -20 -300"   fill="#358A35" opacity="0.85"/>
          <!-- Coconuts -->
          <circle cx="-22" cy="-294" r="6" fill="#8B5A0E"/>
          <circle cx="-13" cy="-306" r="5" fill="#7A4E0C"/>
        </g>

        <!-- RIGHT PALM (leaning left) -->
        <g transform="translate(850, 700) scale(-1,1)">
          <path d="M0 0 Q-6 -70 -10 -150 Q-14 -220 -18 -280" stroke="#7A5420" stroke-width="11" stroke-linecap="round" fill="none"/>
          <path d="M-18 -280 Q-80 -318 -116 -336" stroke="#2A7A2A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <path d="M-18 -280 Q-50 -332 -36 -364"  stroke="#337A33" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <path d="M-18 -280 Q-18 -338 4 -362"    stroke="#2A7A2A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <path d="M-18 -280 Q18 -322 50 -318"    stroke="#337A33" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <path d="M-18 -280 Q26 -286 66 -282"    stroke="#2A7A2A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <path d="M-18 -280 Q-80 -318 -116 -336 Q-65 -310 -18 -280" fill="#358A35" opacity="0.85"/>
          <path d="M-18 -280 Q-50 -332 -36 -364 Q-28 -328 -18 -280"  fill="#2E7A2E" opacity="0.85"/>
          <path d="M-18 -280 Q-18 -338 4 -362 Q-8 -324 -18 -280"     fill="#358A35" opacity="0.85"/>
          <path d="M-18 -280 Q18 -322 50 -318 Q18 -304 -18 -280"     fill="#2E7A2E" opacity="0.85"/>
          <path d="M-18 -280 Q26 -286 66 -282 Q20 -283 -18 -280"     fill="#358A35" opacity="0.85"/>
          <circle cx="-20" cy="-275" r="5.5" fill="#8B5A0E"/>
          <circle cx="-11" cy="-287" r="4.5" fill="#7A4E0C"/>
        </g>

        <!-- Small background palm center-left -->
        <g transform="translate(300, 700)" opacity="0.45">
          <path d="M0 0 Q-4 -50 -7 -110 Q-9 -160 -10 -200" stroke="#7A5420" stroke-width="7" stroke-linecap="round" fill="none"/>
          <path d="M-10 -200 Q-45 -222 -65 -232" stroke="#2A7A2A" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M-10 -200 Q-10 -240 4 -258"   stroke="#337A33" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M-10 -200 Q14 -228 36 -225"   stroke="#2A7A2A" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M-10 -200 Q-45 -222 -65 -232 Q-38 -215 -10 -200" fill="#358A35" opacity="0.8"/>
          <path d="M-10 -200 Q-10 -240 4 -258 Q-4 -228 -10 -200"    fill="#2E7A2E" opacity="0.8"/>
          <path d="M-10 -200 Q14 -228 36 -225 Q12 -216 -10 -200"    fill="#358A35" opacity="0.8"/>
        </g>
      </svg>
    </div>

    <!-- Overlay text -->
    <div class="beach-overlay">
      <div class="brand-mark">
        <div class="brand-pip"></div>
        Love Island Canada
      </div>
      <div class="hero-copy">
        <h1>Your ticket to<br/>the villa.</h1>
        <p>The ultimate companion app for<br/>Canadian watch parties.</p>
      </div>
    </div>
  </div>

  <!-- ==================
       RIGHT: AUTH PANEL
  ================== -->
  <div class="panel-right">

    <!-- Progress bar -->
    <div class="progress-rail">
      <div class="progress-fill" id="progressFill" style="width:50%"></div>
    </div>

    <!-- Auth card -->
    <div class="auth-card" id="authCard"></div>

    <!-- Terms -->
    <p class="terms" id="terms">
      By continuing you agree to our
      <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
    </p>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <div class="toast-pip">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
      <path d="M2 5.5L4.5 8L9 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <span id="toastText">Done!</span>
</div>

<script>
  // ──────────────────────────────────
  //  STATE
  // ──────────────────────────────────
  const app = {
    step:   1,          // 1 | 2 | 'success'
    method: null,       // 'google' | 'apple' | 'email'
    email:  '',
    name:   '',
    code:   '',
  };

  // ──────────────────────────────────
  //  TOAST
  // ──────────────────────────────────
  function toast(msg, ms = 3200) {
    const el = document.getElementById('toast');
    document.getElementById('toastText').textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), ms);
  }

  // ──────────────────────────────────
  //  PROGRESS
  // ──────────────────────────────────
  function setProgress(pct) {
    document.getElementById('progressFill').style.width = pct + '%';
  }

  // ──────────────────────────────────
  //  HELPERS
  // ──────────────────────────────────
  function validEmail(e) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.trim());
  }

  function safe(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  function showErr(errId, inputId, msg) {
    const err = document.getElementById(errId);
    const inp = document.getElementById(inputId);
    if (err) { err.textContent = msg; err.style.display = 'block'; }
    if (inp) { inp.classList.add('err'); inp.focus(); }
  }

  function clearErr(errId, inputId) {
    const err = document.getElementById(errId);
    const inp = document.getElementById(inputId);
    if (err) err.style.display = 'none';
    if (inp) inp.classList.remove('err');
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.disabled = loading;
    if (loading) {
      btn.dataset.orig = btn.innerHTML;
      btn.innerHTML = '<div class="spin"></div>';
    } else if (btn.dataset.orig) {
      btn.innerHTML = btn.dataset.orig;
    }
  }

  function setSocialLoading(btnId) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.disabled = true;
    const icon = btn.querySelector('svg');
    if (icon) icon.replaceWith((() => { const d = document.createElement('div'); d.className='spin'; d.style.cssText='border-color:rgba(0,0,0,.15);border-top-color:#0F172A'; return d; })());
    btn.querySelector('span') && (btn.querySelector('span').textContent = 'Connecting…');
  }

  // ──────────────────────────────────
  //  STEP 1 — AUTH
  // ──────────────────────────────────
  function renderStep1() {
    setProgress(50);
    document.getElementById('terms').style.display = '';
    document.getElementById('authCard').innerHTML = `
      <div class="step-body">
        <div class="step-badge">Step 1 of 2</div>
        <h2 class="card-title">Welcome.</h2>
        <p class="card-sub">Sign in to join your watch party.</p>

        <!-- Google -->
        <button class="btn-social" id="btnGoogle" onclick="handleSocial('google')">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M17.64 9.2a10.3 10.3 0 0 0-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92C16.66 14.07 17.64 11.76 17.64 9.2z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34A9 9 0 0 0 9 18z" fill="#34A853"/>
            <path d="M3.97 10.72A5.41 5.41 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.94H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.06l3.01-2.34z" fill="#FBBC05"/>
            <path d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.94L3.97 7.28C4.68 5.16 6.66 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <!-- Apple -->
        <button class="btn-social" id="btnApple" onclick="handleSocial('apple')">
          <svg width="15" height="18" viewBox="0 0 15 18" fill="none">
            <path d="M12.2 9.55c-.02-1.96 1.6-2.9 1.67-2.94-.92-1.34-2.34-1.52-2.84-1.54-1.2-.13-2.37.71-2.98.71-.62 0-1.57-.69-2.58-.67-1.32.02-2.55.77-3.23 1.95C.73 9.3 1.82 13.1 3.42 15.16c.8 1.06 1.73 2.23 2.95 2.19 1.18-.05 1.63-.76 3.06-.76 1.43 0 1.84.76 3.08.74 1.28-.02 2.09-1.08 2.88-2.14.9-1.23 1.27-2.42 1.29-2.48-.03-.01-2.47-.94-2.48-3.16zM10.26 3.28c.66-.8 1.1-1.91.98-3.01-.95.04-2.1.63-2.78 1.43-.61.7-1.14 1.82-1 2.9 1.06.08 2.13-.54 2.8-1.32z" fill="#0F172A"/>
          </svg>
          <span>Continue with Apple</span>
        </button>

        <div class="divider">
          <div class="div-line"></div>
          <span class="div-text">or continue with email</span>
          <div class="div-line"></div>
        </div>

        <div class="field">
          <label class="field-label" for="emailIn">Email address</label>
          <input
            class="field-input" type="email" id="emailIn"
            placeholder="you@example.com"
            autocomplete="email"
            oninput="clearErr('emailErr','emailIn')"
          />
          <div class="field-err" id="emailErr"></div>
        </div>

        <button class="btn-primary" id="btnContinue" onclick="handleEmailContinue()">
          Continue
        </button>
      </div>
    `;
    setTimeout(() => document.getElementById('emailIn')?.focus(), 80);
  }

  // ──────────────────────────────────
  //  STEP 2 — PROFILE
  // ──────────────────────────────────
  function renderStep2() {
    setProgress(100);
    document.getElementById('authCard').innerHTML = `
      <div class="step-body">
        <button class="btn-back" onclick="goBack()">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <path d="M9 3L5 7.5L9 12" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back
        </button>

        <div class="step-badge">Step 2 of 2</div>
        <h2 class="card-title">Almost there.</h2>
        <p class="card-sub">Set up your profile and join the party.</p>

        <div class="field">
          <label class="field-label" for="nameIn">Display Name</label>
          <input
            class="field-input" type="text" id="nameIn"
            placeholder="e.g. IslandVibesTO"
            maxlength="30"
            autocomplete="nickname"
            oninput="clearErr('nameErr','nameIn')"
          />
          <div class="field-err" id="nameErr"></div>
        </div>

        <div class="field">
          <label class="field-label" for="codeIn">
            Watch Party Code
            <span class="badge-opt">Optional</span>
          </label>
          <input
            class="field-input" type="text" id="codeIn"
            placeholder="Enter invite code"
            maxlength="12"
            oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')"
          />
        </div>

        <button class="btn-primary" id="btnEnter" onclick="handleEnter()">
          Enter the Villa
        </button>
      </div>
    `;
    setTimeout(() => document.getElementById('nameIn')?.focus(), 80);
  }

  // ──────────────────────────────────
  //  SUCCESS
  // ──────────────────────────────────
  function renderSuccess() {
    setProgress(100);
    document.getElementById('terms').style.display = 'none';
    const name = safe(app.name || 'Islander');
    const code = app.code ? `<p style="font-size:13px;color:var(--ocean);font-weight:500;margin-top:6px;">#${safe(app.code)}</p>` : '';
    const via  = app.method ? `<p style="font-size:11.5px;color:var(--muted);margin-top:14px;">Signed in via ${app.method}</p>` : '';
    document.getElementById('authCard').innerHTML = `
      <div class="step-body success-wrap">
        <div class="success-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <path d="M8 14L12 18L20 10" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="card-title" style="text-align:center">Welcome, ${name}! 🌴</h2>
        <p class="card-sub" style="text-align:center;margin-bottom:0">
          ${app.code ? `You're joining party` : "You're all set for the watch party!"}
        </p>
        ${code}
        ${via}
      </div>
    `;
  }

  // ──────────────────────────────────
  //  HANDLERS
  // ──────────────────────────────────
  function handleSocial(provider) {
    app.method = provider;
    setSocialLoading('btn' + provider.charAt(0).toUpperCase() + provider.slice(1));
    document.getElementById('btn' + (provider === 'google' ? 'Apple' : 'Google')).disabled = true;
    document.getElementById('btnContinue').disabled = true;

    // Simulate OAuth redirect + token exchange
    setTimeout(() => {
      app.step = 2;
      renderStep2();
    }, 1300);
  }

  function handleEmailContinue() {
    const val = (document.getElementById('emailIn')?.value || '').trim();
    if (!val)              return showErr('emailErr', 'emailIn', 'Please enter your email address.');
    if (!validEmail(val))  return showErr('emailErr', 'emailIn', 'That doesn\'t look like a valid email.');

    app.email  = val;
    app.method = 'email';
    setLoading('btnContinue', true);

    // Simulate server handshake
    setTimeout(() => {
      app.step = 2;
      renderStep2();
    }, 950);
  }

  function handleEnter() {
    const name = (document.getElementById('nameIn')?.value || '').trim();
    const code = (document.getElementById('codeIn')?.value || '').trim();

    if (!name)        return showErr('nameErr', 'nameIn', 'Please choose a display name.');
    if (name.length < 2) return showErr('nameErr', 'nameIn', 'Display name must be at least 2 characters.');

    app.name = name;
    app.code = code;
    setLoading('btnEnter', true);

    // Simulate profile save + party join
    setTimeout(() => {
      app.step = 'success';
      renderSuccess();
      setTimeout(() => toast(`Welcome to the villa, ${app.name}! 🏝️`), 280);
    }, 1050);
  }

  function goBack() {
    app.step = 1;
    renderStep1();
  }

  // ──────────────────────────────────
  //  KEYBOARD SHORTCUTS
  // ──────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (app.step === 1) {
      if (document.activeElement?.id === 'emailIn') handleEmailContinue();
    } else if (app.step === 2) {
      const id = document.activeElement?.id;
      if (id === 'nameIn' || id === 'codeIn') handleEnter();
    }
  });

  // ──────────────────────────────────
  //  BOOT
  // ──────────────────────────────────
  renderStep1();
</script>
</body>
</html>
